version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: vrcx-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-vrcx_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vrcx_password}
      POSTGRES_DB: ${DB_NAME:-vrcx_messaging}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vrcx_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vrcx-network

  redis:
    image: redis:7-alpine
    container_name: vrcx-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-vrcx_redis_password}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vrcx-network

  messaging-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vrcx-messaging-server
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-vrcx_user}
      DB_PASSWORD: ${DB_PASSWORD:-vrcx_password}
      DB_NAME: ${DB_NAME:-vrcx_messaging}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-vrcx_redis_password}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - vrcx-network

networks:
  vrcx-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: